name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests eval
      - name: Type check
        run: mypy src || true   # advisory for now
      - name: Unit tests
        run: pytest -q
      - name: Eval scenarios valid (regression gate)
        run: python -m eval --validate
