# Reverse proxy for production. Terminate TLS here (certbot) and proxy to the API.
# See docs/11-deployment.md. This is a starting template.

worker_processes auto;
events { worker_connections 1024; }

http {
    upstream ofd_api { server api:8000; }

    server {
        listen 80;
        server_name _;

        client_max_body_size 25m;   # document uploads

        location /health {
            proxy_pass http://ofd_api;
        }

        location / {
            proxy_pass http://ofd_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;        # websockets
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }
    }
}
