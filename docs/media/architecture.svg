<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="960" height="300" rx="14" fill="#f5f8f7" stroke="#d8e2e1"/>
  <text x="28" y="38" font-size="19" font-weight="700" fill="#16242a">OpenFrontDesk - how a call flows</text>
  <text x="28" y="58" font-size="12" fill="#5b6d71">Open-source AI voice receptionist. Provider-agnostic, multi-tenant, self-hostable.</text>

  <g>
    <rect x="24" y="84" width="150" height="84" rx="10" fill="#ffffff" stroke="#d8e2e1"/>
    <text x="99" y="122" font-size="13.5" font-weight="600" fill="#16242a" text-anchor="middle">Caller</text>
    <text x="99" y="142" font-size="10.5" fill="#5b6d71" text-anchor="middle">phone or browser mic</text>
  </g>
  <text x="188" y="132" font-size="20" font-weight="700" fill="#9aabab" text-anchor="middle">&#8250;</text>

  <g>
    <rect x="214" y="84" width="150" height="84" rx="10" fill="#ffffff" stroke="#d8e2e1"/>
    <text x="289" y="122" font-size="13.5" font-weight="600" fill="#16242a" text-anchor="middle">LiveKit</text>
    <text x="289" y="142" font-size="10.5" fill="#5b6d71" text-anchor="middle">WebRTC + SIP</text>
  </g>
  <text x="378" y="132" font-size="20" font-weight="700" fill="#9aabab" text-anchor="middle">&#8250;</text>

  <g>
    <rect x="404" y="84" width="150" height="84" rx="10" fill="#eaf4f2" stroke="#0f9488"/>
    <text x="479" y="120" font-size="13.5" font-weight="600" fill="#0a5f57" text-anchor="middle">Agent Worker</text>
    <text x="479" y="140" font-size="9.5" fill="#0a5f57" text-anchor="middle">STT, LLM (+RAG+tools), TTS</text>
  </g>
  <text x="568" y="132" font-size="20" font-weight="700" fill="#9aabab" text-anchor="middle">&#8250;</text>

  <g>
    <rect x="594" y="84" width="150" height="84" rx="10" fill="#ffffff" stroke="#d8e2e1"/>
    <text x="669" y="122" font-size="13.5" font-weight="600" fill="#16242a" text-anchor="middle">API + Services</text>
    <text x="669" y="142" font-size="10.5" fill="#5b6d71" text-anchor="middle">FastAPI</text>
  </g>
  <text x="758" y="132" font-size="20" font-weight="700" fill="#9aabab" text-anchor="middle">&#8250;</text>

  <g>
    <rect x="784" y="84" width="152" height="84" rx="10" fill="#ffffff" stroke="#d8e2e1"/>
    <text x="860" y="120" font-size="13.5" font-weight="600" fill="#16242a" text-anchor="middle">Data</text>
    <text x="860" y="140" font-size="9.5" fill="#5b6d71" text-anchor="middle">Postgres + pgvector, Redis</text>
  </g>

  <rect x="24" y="200" width="912" height="72" rx="10" fill="#ffffff" stroke="#d8e2e1"/>
  <text x="40" y="226" font-size="12" font-weight="600" fill="#16242a">Swappable providers (change by configuration, no code edits):</text>
  <text x="40" y="248" font-size="12" fill="#0a5f57">Free: Groq (STT + LLM), Gemini (LLM), Kokoro (TTS), fastembed (embeddings)</text>
  <text x="40" y="265" font-size="12" fill="#5b6d71">Premium: Deepgram (STT), Claude / Gemini (LLM), Cartesia (TTS)</text>
</svg>
